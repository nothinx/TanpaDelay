sentence=Pengganti delay() berbahasa Indonesia: jalankan beberapa hal bersamaan tanpa program berhenti.
paragraph=Cukup if (kedip.waktunya()) di loop(), tanpa callback dan tanpa menghitung millis() sendiri. Berkala tanpa drift, tidak mengejar saat loop() sempat macet, sekali jalan untuk lampu mati otomatis, sisa waktu, dan aman saat millis() meluap. 9 byte RAM per objek di Arduino Uno. English: non-blocking delay, millis timer, interval, timeout, one-shot, no drift, low RAM.
